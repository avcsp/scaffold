name: build

on:
  push:
    tags:
      - "**"

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: build
    runs-on: ubuntu-latest

    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: ghcr::login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: version
        run: echo "version=${{ github.ref_name }}-build-${{ github.run_number }}-${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: docker::build
        run:
          docker build --build-arg version=${{ env.version }} --tag ghcr.io/${{ github.repository }}:${{ env.version }} .

      - name: docker::publish
        run:
          docker push ghcr.io/${{ github.repository }}:${{ env.version }}
