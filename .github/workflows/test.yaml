name: test

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:

  test:
    runs-on: ubuntu-latest
    steps:

      - name: checkout
        uses: actions/checkout@v4

      - name: configure::golang
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"

      - name: test
        run: go test ./... -count=1 -race
